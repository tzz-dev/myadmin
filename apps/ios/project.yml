name: MyAdmin
options:
  bundleIdPrefix: com.twotwo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  MyAdmin:
    type: application
    platform: iOS
    sources: [MyAdmin]
    info:
      path: MyAdmin/Info.plist
      properties:
        UILaunchScreen: {}
        APIBaseURL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twotwo.myadmin
        API_BASE_URL: http:/$()/localhost:3002
