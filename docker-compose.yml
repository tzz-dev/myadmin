services:
  postgres:
    image: postgres:17
    container_name: myadmin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myadmin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myadmin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
